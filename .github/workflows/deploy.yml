name: Deploy Bicep

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}


    - name: Deploy Bicep
      uses: azure/cli@v2
      with:
        inlineScript: |
          az deployment group create \
            --resource-group RG-GitHub-Bicep \
            --template-file main.bicep \
            --parameters storageAccountName=storage${{ github.run_number }}
